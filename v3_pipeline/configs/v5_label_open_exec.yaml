# V5 label 候选：open_exec 族（T+1 开盘买 → T+1+h 收盘卖）
#
# 与 v4_0_0_clean 的唯一区别：label_prefix/return_prefix 切到 open_exec 族，
# exclude_patterns 追加全部 label 族列防泄漏（其余 label 列永不可作特征）。
#
# 训练命令：
#   python v3_pipeline/scripts/train_ranking.py \
#     --config v3_pipeline/configs/v5_label_open_exec.yaml \
#     --cache v3_pipeline/feature_cache_v5_labels.parquet \
#     --output v3_pipeline/models/v5_label_open_exec
experiment_name: v5_label_open_exec
version: v5.0.0

data:
  feature_cache: v3_pipeline/feature_cache_v5_labels.parquet

features:
  exclude_patterns:
  - ^label_
  - ^future_return_
  - ^rank_future_return_
  - ^stop_loss_return_   # 泄漏实锤列，永久排除
  - ^open_exec_return_   # 本族原始收益（label 源，禁作特征）
  - ^rank_open_exec_return_
  - ^mfr_                # mfr 族全部（含 rank_mfr_）

training:
  label_prefix: rank_open_exec_return_
  return_prefix: open_exec_return_
  horizons:
  - 3d
  - 5d
  - 10d
  - 15d
  - 20d
  - 25d
  - 30d
  - 45d
  - 60d
  train_end: '2021-12-31'
  val_start: '2022-01-01'
  val_end: '2025-07-31'

model:
  objective: lambdarank
  metric: ndcg
  ndcg_eval_at: [5, 10, 20]
  num_boost_round: 1000
  early_stopping_rounds: 50
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  lambda_l1: 0.0
  lambda_l2: 0.0
  verbose: 10

evaluation:
  metrics:
  - rank_ic
  - rank_icir
  - top5_excess_return
  - top10_excess_return
  # 口径说明：最终指标以 v3_pipeline/scripts/evaluate_honest.py 输出为准
  # （不重叠窗口、正规 Sharpe、含 0.26%/期双边成本）。
  success_threshold:
    net_annual_excess: 0.15   # 净年化 > 基准 +15% 才过线（用户裁决 2026-08-29）
    sharpe: 0.5
