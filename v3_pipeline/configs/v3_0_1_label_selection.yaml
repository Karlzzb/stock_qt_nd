# V3.0.1 Label Selection Experiment
# Train all 7 horizons to find optimal prediction window

version: v3.0.1
experiment_name: label_selection

# Data paths
data:
  feature_cache: v3_pipeline/feature_cache_v3.parquet
  output_dir: v3_pipeline/models/v3_0_1_label_selection

# Training configuration
training:
  # Single-split strategy (same as baseline)
  train_end: "2021-12-31"
  val_start: "2022-01-01"
  val_end: "2025-07-31"

  # All prediction horizons for comparison
  horizons:
    - 3d
    - 5d
    - 10d
    - 15d
    - 20d
    - 25d
    - 30d

# LightGBM lambdarank hyperparameters (same as baseline)
model:
  objective: lambdarank
  metric: ndcg
  ndcg_eval_at: [5, 10, 20]

  # Tree structure
  num_leaves: 31
  max_depth: -1

  # Learning rate
  learning_rate: 0.05

  # Sampling
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5

  # Regularization
  min_data_in_leaf: 100
  lambda_l1: 0.0
  lambda_l2: 0.0

  # Training
  num_boost_round: 1000
  early_stopping_rounds: 50
  verbose: 10

# Evaluation metrics
evaluation:
  metrics:
    - rank_ic
    - rank_icir
    - top5_excess_return
    - ic_pos_ratio
    - ndcg@5
    - ndcg@10

  # Stage 1 success thresholds (from PRD #27)
  success_threshold:
    icir: 2.0          # Minimum ICIR for tradability
    ic_pos_ratio: 0.60 # Minimum IC positive ratio
    top5_excess: 0.15  # Minimum 15% annual Top5 excess return

# Feature configuration
features:
  # Exclude future information and labels
  exclude_patterns:
    - "^label_"
    - "^future_return_"
    - "^rank_future_return_"
