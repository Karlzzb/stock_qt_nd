# V3.0.0 Baseline Configuration
# Ranking-based pipeline using LightGBM lambdarank objective

version: v3.0.0
experiment_name: baseline

# Data paths
data:
  feature_cache: feature_cache_all.parquet
  output_cache: v3_pipeline/models/v3_0_0_feature_cache.parquet

# Training configuration
training:
  # Single-split strategy
  train_end: "2021-12-31"
  val_start: "2022-01-01"
  val_end: "2025-07-31"

  # Prediction horizons to train
  horizons:
    - 10d
    - 30d

# LightGBM lambdarank hyperparameters
model:
  objective: lambdarank
  metric: ndcg
  ndcg_eval_at: [5, 10, 20]

  # Tree structure
  num_leaves: 31
  max_depth: -1

  # Learning rate
  learning_rate: 0.05

  # Sampling
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5

  # Regularization
  min_data_in_leaf: 100
  lambda_l1: 0.0
  lambda_l2: 0.0

  # Training
  num_boost_round: 1000
  early_stopping_rounds: 50
  verbose: 10

# Evaluation metrics
evaluation:
  metrics:
    - rank_ic
    - rank_icir
    - top5_excess_return
    - top10_excess_return
    - ndcg@5
    - ndcg@10

  # Success criteria (tradable threshold)
  success_threshold:
    icir: 0.5  # Target: 3× improvement over v2's 0.162
    top5_excess: 0.0  # Target: positive excess returns

# Feature configuration
features:
  # Reuse v2's 626 features to isolate label improvement
  exclude_patterns:
    - "^label_"
    - "^future_return_"
    - "^rank_future_return_"
