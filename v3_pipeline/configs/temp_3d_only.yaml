data:
  feature_cache: feature_cache_all.parquet
  output_cache: v3_pipeline/models/v3_0_0_feature_cache.parquet
evaluation:
  metrics:
  - rank_ic
  - rank_icir
  - top5_excess_return
  - top10_excess_return
  - ndcg@5
  - ndcg@10
  success_threshold:
    icir: 0.5
    top5_excess: 0.0
experiment_name: baseline
features:
  exclude_patterns:
  - ^label_
  - ^future_return_
  - ^rank_future_return_
model:
  bagging_fraction: 0.8
  bagging_freq: 5
  early_stopping_rounds: 50
  feature_fraction: 0.8
  lambda_l1: 0.0
  lambda_l2: 0.0
  learning_rate: 0.05
  max_depth: -1
  metric: ndcg
  min_data_in_leaf: 100
  ndcg_eval_at:
  - 5
  - 10
  - 20
  num_boost_round: 1000
  num_leaves: 31
  objective: lambdarank
  verbose: 10
training:
  horizons:
  - 3d
  train_end: '2021-12-31'
  val_end: '2025-07-31'
  val_start: '2022-01-01'
version: v3.0.0
