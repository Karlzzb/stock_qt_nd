# Stage 2: Feature Screening Configuration
# Selected label from Stage 1: 3d (ICIR = 44.203)

label_horizon: "3d"
baseline_model_dir: "v3_pipeline/models/v3_0_1_label_selection"
output_model_dir: "v3_pipeline/models/v3_0_2_optimized_3d"
output_results_dir: "v3_pipeline/results"

# Feature screening parameters
collinearity:
  vif_threshold: 999999  # Effectively skip VIF (too slow and unstable with 454 features)
  correlation_threshold: 0.95

permutation:
  n_repeats: 5  # Number of permutation rounds
  random_state: 42
  n_jobs: -1

# Feature subset sizes to test
feature_subsets: [50, 100, 150, 200]

# Performance target
performance_target:
  baseline_icir: 44.203  # From Stage 1
  min_retention: 0.95    # Must maintain >= 95% of baseline

# LightGBM parameters (same as Stage 1)
lgbm_params:
  objective: "lambdarank"
  metric: "ndcg"
  ndcg_eval_at: [5, 10, 20]
  num_leaves: 31
  learning_rate: 0.05
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  max_depth: -1
  min_child_samples: 20
  verbose: -1
  seed: 42

training:
  num_boost_round: 500
  early_stopping_rounds: 50
  verbose_eval: 50

# Data split
data:
  train_start: "2001-01-02"
  train_end: "2021-12-31"
  val_start: "2022-01-01"
  val_end: "2025-07-31"
