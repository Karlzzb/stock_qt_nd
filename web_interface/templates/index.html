<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>股票AI量化交易系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header .subtitle {
            color: #666;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title .icon {
            font-size: 20px;
            margin-right: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-size: 14px;
        }

        .info-value {
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }

        .info-value.money {
            color: #f56c6c;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-success {
            background: #67c23a;
            color: white;
        }

        .btn-warning {
            background: #e6a23c;
            color: white;
        }

        .btn-danger {
            background: #f56c6c;
            color: white;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .position-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .position-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .position-code {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .position-shares {
            color: #666;
            font-size: 14px;
        }

        .position-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .status-bar {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .status-running {
            background: #e1f3d8;
            color: #67c23a;
        }

        .status-error {
            background: #fde2e2;
            color: #f56c6c;
        }

        .log-content {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .report-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .report-item:active {
            background: #e9e9e9;
        }

        .report-date {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .report-info {
            font-size: 12px;
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 50px auto;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        /* 持仓编辑器样式 */
        .position-editor-card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            position: relative;
        }

        .position-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }

        .position-editor-title {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }

        .position-delete-btn {
            background: #f56c6c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .position-delete-btn:hover {
            background: #e85555;
        }

        .position-editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .position-editor-field {
            display: flex;
            flex-direction: column;
        }

        .position-editor-field.full-width {
            grid-column: 1 / -1;
        }

        .position-editor-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .position-editor-input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .position-editor-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .position-editor-input.error {
            border-color: #f56c6c;
        }

        .add-position-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .add-position-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .add-position-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            .position-editor-grid {
                grid-template-columns: 1fr;
            }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 600px) {
            .position-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📈 股票AI量化交易系统</h1>
            <div class="subtitle">智能交易 · 数据驱动</div>
        </div>

        <!-- 标签页 -->
        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('portfolio')">💰 资金持仓</div>
                <div class="tab" onclick="switchTab('execute')">🚀 执行交易</div>
                <div class="tab" onclick="switchTab('reports')">📊 交易报告</div>
            </div>

            <!-- 资金持仓标签页 -->
            <div id="portfolio-tab" class="tab-content active">
                <!-- 资金信息 -->
                <div class="card-title">
                    <span><span class="icon">💵</span>当前资金</span>
                    <button class="btn btn-warning" onclick="editCash()" style="width: auto; padding: 8px 15px; margin: 0; font-size: 14px;">编辑</button>
                </div>
                <div id="cash-info">
                    <div class="loading">加载中...</div>
                </div>

                <!-- 持仓信息 -->
                <div class="card-title" style="margin-top: 20px;">
                    <span><span class="icon">📦</span>当前持仓</span>
                    <button class="btn btn-warning" onclick="editPositions()" style="width: auto; padding: 8px 15px; margin: 0; font-size: 14px;">编辑</button>
                </div>
                <div id="positions-info">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 执行交易标签页 -->
            <div id="execute-tab" class="tab-content">
                <div class="card-title">
                    <span><span class="icon">⚡</span>执行状态</span>
                </div>
                <div id="execution-status" class="status-bar">
                    <div>状态: <span id="status-text">就绪</span></div>
                    <div id="progress-text" style="margin-top: 5px; font-size: 12px; color: #999;"></div>
                </div>
                
                <button id="execute-btn" class="btn btn-primary" onclick="executeTrading()">
                    🚀 执行每日交易
                </button>
                
                <button id="stop-btn" class="btn btn-danger" onclick="stopExecution()" style="display: none;">
                    ⛔ 停止执行
                </button>

                <div id="log-section" style="display: none; margin-top: 15px;">
                    <div class="card-title">
                        <span><span class="icon">📝</span>执行日志</span>
                    </div>
                    <div id="log-content" class="log-content"></div>
                </div>
            </div>

            <!-- 交易报告标签页 -->
            <div id="reports-tab" class="tab-content">
                <div class="card-title">
                    <span><span class="icon">📄</span>最近报告</span>
                </div>
                <div id="reports-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑资金模态框 -->
    <div id="cash-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑资金</div>
                <div class="modal-close" onclick="closeCashModal()">×</div>
            </div>
            <div class="input-group">
                <label>当前资金 (元)</label>
                <input type="number" id="cash-input" step="0.01" placeholder="请输入资金金额">
            </div>
            <button class="btn btn-success" onclick="saveCash()">💾 保存</button>
        </div>
    </div>

    <!-- 编辑持仓模态框 -->
    <div id="positions-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑持仓</div>
                <div class="modal-close" onclick="closePositionsModal()">×</div>
            </div>
            
            <!-- 添加新持仓按钮 -->
            <div class="add-position-card" onclick="addNewPosition()">
                <div class="add-position-icon">➕</div>
                <div>添加新持仓</div>
            </div>
            
            <!-- 持仓编辑器容器 -->
            <div id="positions-editor">
                <div class="loading">加载中...</div>
            </div>
            
            <button class="btn btn-success" onclick="savePositions()">💾 保存所有持仓</button>
        </div>
    </div>

    <!-- 查看报告模态框 -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="report-modal-title">交易报告</div>
                <div class="modal-close" onclick="closeReportModal()">×</div>
            </div>
            <div id="report-content" class="log-content" style="max-height: 60vh;"></div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE = '';

        // 当前持仓数据
        let currentPositions = [];

        // 页面加载时初始化
        window.onload = function() {
            loadCashInfo();
            loadPositions();
            loadReports();
            startStatusPolling();
        };

        // 切换标签页
        function switchTab(tabName) {
            // 更新标签样式
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // 显示对应内容
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');

            // 加载对应数据
            if (tabName === 'reports') {
                loadReports();
            }
        }

        // 加载资金信息
        async function loadCashInfo() {
            try {
                const response = await fetch(API_BASE + '/api/portfolio/cash');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    document.getElementById('cash-info').innerHTML = `
                        <div class="info-row">
                            <span class="info-label">可用资金</span>
                            <span class="info-value money">¥${parseFloat(data.cash).toLocaleString()}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">最后运行</span>
                            <span class="info-value">${data.last_run_date || '未运行'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">更新时间</span>
                            <span class="info-value">${data.update_time || '-'}</span>
                        </div>
                    `;
                } else {
                    document.getElementById('cash-info').innerHTML = '<div class="empty-state">暂无数据</div>';
                }
            } catch (error) {
                document.getElementById('cash-info').innerHTML = '<div class="empty-state">加载失败</div>';
                console.error('加载资金信息失败:', error);
            }
        }

        // 加载持仓信息
        async function loadPositions() {
            try {
                const response = await fetch(API_BASE + '/api/portfolio/positions');
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    currentPositions = result.data;
                    let html = '';
                    result.data.forEach(pos => {
                        html += `
                            <div class="position-item">
                                <div class="position-header">
                                    <span class="position-code">${pos.code}</span>
                                    <span class="position-shares">${pos.shares} 股</span>
                                </div>
                                <div class="position-details">
                                    <div>成本: ¥${parseFloat(pos.avg_cost).toFixed(2)}</div>
                                    <div>买入: ${pos.entry_date}</div>
                                    <div>止损: ¥${parseFloat(pos.stop_loss_price).toFixed(2)}</div>
                                    <div>止盈: ¥${parseFloat(pos.take_profit_price).toFixed(2)}</div>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('positions-info').innerHTML = html;
                } else {
                    currentPositions = [];
                    document.getElementById('positions-info').innerHTML = '<div class="empty-state">暂无持仓</div>';
                }
            } catch (error) {
                document.getElementById('positions-info').innerHTML = '<div class="empty-state">加载失败</div>';
                console.error('加载持仓信息失败:', error);
            }
        }

        // 编辑资金
        async function editCash() {
            try {
                const response = await fetch(API_BASE + '/api/portfolio/cash');
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('cash-input').value = result.data.cash;
                    document.getElementById('cash-modal').style.display = 'block';
                }
            } catch (error) {
                alert('加载资金信息失败');
            }
        }

        // 保存资金
        async function saveCash() {
            const cash = document.getElementById('cash-input').value;
            
            if (!cash || parseFloat(cash) < 0) {
                alert('请输入有效的资金金额');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/api/portfolio/cash', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({cash: parseFloat(cash)})
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('资金更新成功');
                    closeCashModal();
                    loadCashInfo();
                } else {
                    alert('更新失败: ' + result.error);
                }
            } catch (error) {
                alert('保存失败');
                console.error('保存资金失败:', error);
            }
        }

        // 关闭资金模态框
        function closeCashModal() {
            document.getElementById('cash-modal').style.display = 'none';
        }

        // 编辑持仓
        function editPositions() {
            renderPositionEditor();
            document.getElementById('positions-modal').style.display = 'block';
        }

        // 渲染持仓编辑器
        function renderPositionEditor() {
            const container = document.getElementById('positions-editor');
            
            if (currentPositions.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无持仓，点击上方按钮添加新持仓</div>';
                return;
            }
            
            let html = '';
            currentPositions.forEach((position, index) => {
                html += createPositionEditorCard(position, index);
            });
            
            container.innerHTML = html;
        }

        // 创建持仓编辑卡片
        function createPositionEditorCard(position, index) {
            return `
                <div class="position-editor-card" data-index="${index}">
                    <div class="position-editor-header">
                        <div class="position-editor-title">持仓 #${index + 1}</div>
                        <button class="position-delete-btn" onclick="deletePosition(${index})">🗑️ 删除</button>
                    </div>
                    
                    <div class="position-editor-grid">
                        <div class="position-editor-field">
                            <label class="position-editor-label">股票代码 *</label>
                            <input type="text" 
                                   class="position-editor-input" 
                                   data-field="code" 
                                   data-index="${index}"
                                   value="${position.code || ''}"
                                   placeholder="例: 688528.SH"
                                   required>
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">持仓数量 *</label>
                            <input type="number" 
                                   class="position-editor-input" 
                                   data-field="shares" 
                                   data-index="${index}"
                                   value="${position.shares || ''}"
                                   placeholder="股数"
                                   step="100"
                                   required>
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">平均成本 *</label>
                            <input type="number" 
                                   class="position-editor-input" 
                                   data-field="avg_cost" 
                                   data-index="${index}"
                                   value="${position.avg_cost || ''}"
                                   placeholder="元/股"
                                   step="0.01"
                                   required>
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">买入日期 *</label>
                            <input type="date" 
                                   class="position-editor-input" 
                                   data-field="entry_date" 
                                   data-index="${index}"
                                   value="${position.entry_date || ''}"
                                   required>
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">止损价格 *</label>
                            <input type="number" 
                                   class="position-editor-input" 
                                   data-field="stop_loss_price" 
                                   data-index="${index}"
                                   value="${position.stop_loss_price || ''}"
                                   placeholder="元/股"
                                   step="0.01"
                                   required>
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">止盈价格 *</label>
                            <input type="number" 
                                   class="position-editor-input" 
                                   data-field="take_profit_price" 
                                   data-index="${index}"
                                   value="${position.take_profit_price || ''}"
                                   placeholder="元/股"
                                   step="0.01"
                                   required>
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">应卖出日期</label>
                            <input type="date" 
                                   class="position-editor-input" 
                                   data-field="should_sell_date" 
                                   data-index="${index}"
                                   value="${position.should_sell_date || ''}">
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">实际卖出价格</label>
                            <input type="number" 
                                   class="position-editor-input" 
                                   data-field="actual_sell_price" 
                                   data-index="${index}"
                                   value="${position.actual_sell_price || ''}"
                                   placeholder="元/股"
                                   step="0.01">
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">实际卖出日期</label>
                            <input type="date" 
                                   class="position-editor-input" 
                                   data-field="actual_sell_date" 
                                   data-index="${index}"
                                   value="${position.actual_sell_date || ''}">
                        </div>
                        
                        <div class="position-editor-field">
                            <label class="position-editor-label">是否已卖出</label>
                            <select class="position-editor-input" 
                                    data-field="is_sold" 
                                    data-index="${index}">
                                <option value="NO" ${position.is_sold === 'NO' ? 'selected' : ''}>否</option>
                                <option value="YES" ${position.is_sold === 'YES' ? 'selected' : ''}>是</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;
        }

        // 添加新持仓
        function addNewPosition() {
            const newPosition = {
                code: '',
                avg_cost: '',
                shares: '',
                entry_date: new Date().toISOString().split('T')[0],
                stop_loss_price: '',
                take_profit_price: '',
                should_sell_date: '',
                actual_sell_price: '',
                actual_sell_date: '',
                is_sold: 'NO'
            };
            
            currentPositions.push(newPosition);
            renderPositionEditor();
            
            // 滚动到新添加的持仓
            setTimeout(() => {
                const container = document.getElementById('positions-editor');
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        // 删除持仓
        function deletePosition(index) {
            if (confirm('确定要删除这个持仓吗？')) {
                currentPositions.splice(index, 1);
                renderPositionEditor();
            }
        }

        // 保存持仓
        async function savePositions() {
            try {
                // 从表单收集数据
                const updatedPositions = [];
                const inputs = document.querySelectorAll('.position-editor-input');
                
                // 按索引组织数据
                const positionsByIndex = {};
                inputs.forEach(input => {
                    const index = input.dataset.index;
                    const field = input.dataset.field;
                    
                    if (!positionsByIndex[index]) {
                        positionsByIndex[index] = {};
                    }
                    
                    positionsByIndex[index][field] = input.value;
                });
                
                // 验证并转换为数组
                let hasError = false;
                for (let index in positionsByIndex) {
                    const position = positionsByIndex[index];
                    
                    // 验证必填字段
                    if (!position.code || !position.shares || !position.avg_cost || 
                        !position.entry_date || !position.stop_loss_price || !position.take_profit_price) {
                        alert(`持仓 #${parseInt(index) + 1} 有必填字段未填写`);
                        hasError = true;
                        break;
                    }
                    
                    // 验证股票代码格式
                    if (!/^\d{6}\.(SH|SZ)$/.test(position.code)) {
                        alert(`持仓 #${parseInt(index) + 1} 的股票代码格式不正确\n正确格式: 688528.SH 或 000001.SZ`);
                        hasError = true;
                        break;
                    }
                    
                    updatedPositions.push(position);
                }
                
                if (hasError) {
                    return;
                }
                
                // 发送到服务器
                const response = await fetch(API_BASE + '/api/portfolio/positions', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({positions: updatedPositions})
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('持仓更新成功！');
                    currentPositions = updatedPositions;
                    closePositionsModal();
                    loadPositions();
                } else {
                    alert('更新失败: ' + result.error);
                }
            } catch (error) {
                alert('保存失败: ' + error.message);
                console.error('保存持仓失败:', error);
            }
        }

        // 关闭持仓模态框
        function closePositionsModal() {
            document.getElementById('positions-modal').style.display = 'none';
        }

        // 执行交易
        async function executeTrading() {
            // 先检查当前状态，防止重复执行
            try {
                const statusResponse = await fetch(API_BASE + '/api/status');
                const currentStatus = await statusResponse.json();
                
                if (currentStatus.running) {
                    alert('脚本正在运行中，请勿重复执行！');
                    return;
                }
            } catch (error) {
                console.error('检查状态失败:', error);
            }
            
            if (!confirm('确定要执行每日交易吗？\n\n这将:\n1. 下载最新股票数据\n2. 进行特征工程\n3. 生成预测\n4. 执行交易策略')) {
                return;
            }

            try {
                document.getElementById('execute-btn').disabled = true;
                document.getElementById('execute-btn').style.display = 'none';
                document.getElementById('stop-btn').style.display = 'block';
                document.getElementById('status-text').textContent = '启动中...';
                
                const response = await fetch(API_BASE + '/api/execute', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('log-section').style.display = 'block';
                    startLogPolling();
                } else {
                    alert('执行失败: ' + result.error);
                    document.getElementById('execute-btn').disabled = false;
                    document.getElementById('execute-btn').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'none';
                }
            } catch (error) {
                alert('执行失败');
                console.error('执行交易失败:', error);
                document.getElementById('execute-btn').disabled = false;
                document.getElementById('execute-btn').style.display = 'block';
                document.getElementById('stop-btn').style.display = 'none';
            }
        }

        // 停止执行
        async function stopExecution() {
            if (!confirm('确定要停止执行吗？\n\n当前任务将被中断。')) {
                return;
            }

            try {
                document.getElementById('stop-btn').disabled = true;
                document.getElementById('status-text').textContent = '正在停止...';
                
                const response = await fetch(API_BASE + '/api/stop', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('status-text').textContent = '已停止';
                    document.getElementById('progress-text').textContent = '执行已被用户停止';
                    
                    // 等待一下让状态更新
                    setTimeout(() => {
                        document.getElementById('execute-btn').disabled = false;
                        document.getElementById('execute-btn').style.display = 'block';
                        document.getElementById('stop-btn').style.display = 'none';
                        document.getElementById('stop-btn').disabled = false;
                    }, 1000);
                } else {
                    alert('停止失败: ' + result.error);
                    document.getElementById('stop-btn').disabled = false;
                }
            } catch (error) {
                alert('停止失败');
                console.error('停止执行失败:', error);
                document.getElementById('stop-btn').disabled = false;
            }
        }

        // 轮询执行状态
        let statusInterval = null;
        function startStatusPolling() {
            if (statusInterval) clearInterval(statusInterval);
            
            // 立即检查一次状态
            updateStatus();
            
            // 然后每2秒检查一次
            statusInterval = setInterval(updateStatus, 2000);
        }
        
        // 更新状态的函数
        async function updateStatus() {
            try {
                const response = await fetch(API_BASE + '/api/status');
                const status = await response.json();
                
                if (status.running) {
                    document.getElementById('status-text').textContent = '运行中';
                    document.getElementById('progress-text').textContent = status.progress || '';
                    document.getElementById('execution-status').className = 'status-bar status-running';
                    document.getElementById('execute-btn').disabled = true;
                    document.getElementById('execute-btn').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'block';
                    document.getElementById('stop-btn').disabled = false;
                    
                    // 如果正在运行，确保日志轮询也在运行
                    if (status.log_file && !logInterval) {
                        document.getElementById('log-section').style.display = 'block';
                        startLogPolling();
                    }
                } else {
                    document.getElementById('status-text').textContent = '就绪';
                    document.getElementById('progress-text').textContent = status.progress || '';
                    document.getElementById('execution-status').className = 'status-bar';
                    document.getElementById('execute-btn').disabled = false;
                    document.getElementById('execute-btn').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'none';
                }
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }

        // 轮询日志
        let logInterval = null;
        let currentLogFile = null;
        function startLogPolling() {
            if (logInterval) clearInterval(logInterval);
            
            logInterval = setInterval(async () => {
                try {
                    const statusResponse = await fetch(API_BASE + '/api/status');
                    const status = await statusResponse.json();
                    
                    if (status.log_file) {
                        const logFile = status.log_file.split(/[/\\]/).pop();
                        
                        const logResponse = await fetch(API_BASE + '/api/logs/' + logFile);
                        const logResult = await logResponse.json();
                        
                        if (logResult.success) {
                            const logDiv = document.getElementById('log-content');
                            logDiv.textContent = logResult.content;
                            logDiv.scrollTop = logDiv.scrollHeight;
                        }
                    }
                    
                    if (!status.running && logInterval) {
                        clearInterval(logInterval);
                        logInterval = null;
                        loadCashInfo();
                        loadPositions();
                    }
                } catch (error) {
                    console.error('获取日志失败:', error);
                }
            }, 2000);
        }

        // 加载报告列表
        async function loadReports() {
            try {
                const response = await fetch(API_BASE + '/api/reports');
                const result = await response.json();
                
                if (result.success && result.reports.length > 0) {
                    let html = '';
                    result.reports.forEach(report => {
                        html += `
                            <div class="report-item" onclick="viewReport('${report.name}')">
                                <div class="report-date">📅 ${report.date}</div>
                                <div class="report-info">
                                    大小: ${(report.size / 1024).toFixed(1)} KB | 
                                    更新: ${new Date(report.modified).toLocaleString()}
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('reports-list').innerHTML = html;
                } else {
                    document.getElementById('reports-list').innerHTML = '<div class="empty-state">暂无报告</div>';
                }
            } catch (error) {
                document.getElementById('reports-list').innerHTML = '<div class="empty-state">加载失败</div>';
                console.error('加载报告列表失败:', error);
            }
        }

        // 查看报告
        async function viewReport(filename) {
            try {
                document.getElementById('report-modal-title').textContent = '报告: ' + filename;
                document.getElementById('report-content').textContent = '加载中...';
                document.getElementById('report-modal').style.display = 'block';
                
                const response = await fetch(API_BASE + '/api/reports/' + filename);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('report-content').textContent = result.content;
                } else {
                    document.getElementById('report-content').textContent = '加载失败';
                }
            } catch (error) {
                document.getElementById('report-content').textContent = '加载失败';
                console.error('查看报告失败:', error);
            }
        }

        // 关闭报告模态框
        function closeReportModal() {
            document.getElementById('report-modal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        };
    </script>
</body>
</html>
