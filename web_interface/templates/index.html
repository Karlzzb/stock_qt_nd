<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>股票AI量化交易系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header .subtitle {
            color: #666;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title .icon {
            font-size: 20px;
            margin-right: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-size: 14px;
        }

        .info-value {
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }

        .info-value.money {
            color: #f56c6c;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-success {
            background: #67c23a;
            color: white;
        }

        .btn-warning {
            background: #e6a23c;
            color: white;
        }

        .btn-danger {
            background: #f56c6c;
            color: white;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .position-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .position-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .position-code {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .position-shares {
            color: #666;
            font-size: 14px;
        }

        .position-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }

        .status-bar {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .status-running {
            background: #e1f3d8;
            color: #67c23a;
        }

        .status-error {
            background: #fde2e2;
            color: #f56c6c;
        }

        .log-content {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .report-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .report-item:active {
            background: #e9e9e9;
        }

        .report-date {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .report-info {
            font-size: 12px;
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 50px auto;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        /* 持仓编辑器样式 */
        .position-editor-card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            position: relative;
        }

        .position-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }

        .position-editor-title {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }

        .position-delete-btn {
            background: #f56c6c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .position-delete-btn:hover {
            background: #e85555;
        }

        .position-editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .position-editor-field {
            display: flex;
            flex-direction: column;
        }

        .position-editor-field.full-width {
            grid-column: 1 / -1;
        }

        .position-editor-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .position-editor-input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .position-editor-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .position-editor-input.error {
            border-color: #f56c6c;
        }

        .add-position-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .add-position-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .add-position-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            .position-editor-grid {
                grid-template-columns: 1fr;
            }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 600px) {
            .position-details {
                grid-template-columns: 1fr;
            }
        }

        /* 新增样式 */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #666; font-size: 14px; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .tabs { margin-bottom: 15px; display: flex; gap: 10px; }
        .tab-btn { padding: 8px 16px; border: none; background: #f0f0f0; cursor: pointer; border-radius: 5px; flex: 1; }
        .tab-btn.active { background: #667eea; color: white; }
        .tab-panel { padding: 10px 0; }
        .status-text.running { color: orange; }
        .script-status { margin-bottom: 15px; }
        .button-group { display: flex; gap: 20px; }
        #config-message, #sell-message, #buy-message, #data-prep-message { margin-top: 10px; padding: 10px; border-radius: 5px; }
        #config-message.success, #sell-message.success, #buy-message.success { background: #f0f9ff; color: #67c23a; }
        #config-message.error, #sell-message.error, #buy-message.error { background: #fef0f0; color: #f56c6c; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📈 股票AI量化交易系统</h1>
            <div class="subtitle">智能交易 · 数据驱动</div>
        </div>

        <!-- 标签页 -->
        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('portfolio')">💰 资金持仓</div>
                <div class="tab" onclick="switchTab('execute')">🚀 执行策略</div>
                <div class="tab" onclick="switchTab('reports')">📊 交易报告</div>
                <div class="tab" onclick="switchTab('manual')">💵 手动交易</div>
                <div class="tab" onclick="switchTab('dataprep')">📥 数据准备</div>
            </div>

            <!-- 资金持仓标签页 -->
            <div id="portfolio-tab" class="tab-content active">
                <!-- 资金信息 -->
                <div class="card-title">
                    <span><span class="icon">💵</span>当前资金</span>
                    <button class="btn btn-warning" onclick="editCash()" style="width: auto; padding: 8px 15px; margin: 0; font-size: 14px;">编辑</button>
                </div>
                <div id="cash-info">
                    <div class="loading">加载中...</div>
                </div>

                <!-- 持仓信息 -->
                <div class="card-title" style="margin-top: 20px;">
                    <span><span class="icon">📦</span>当前持仓</span>
                    <button class="btn btn-warning" onclick="editPositions()" style="width: auto; padding: 8px 15px; margin: 0; font-size: 14px;">编辑</button>
                </div>
                <div id="positions-info">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 执行交易标签页 -->
            <div id="execute-tab" class="tab-content">
                <div class="card-title">
                    <span><span class="icon">📅</span>日期参数</span>
                </div>

                <div class="input-group">
                    <label>预测日期 (PREDICT_DATE)</label>
                    <input type="date" id="predict-date-input" value="">
                    <div style="font-size: 12px; color: #999; margin-top: 5px;">默认: 今天</div>
                </div>

                <div class="input-group">
                    <label>特征日期 (FEATURE_DATE)</label>
                    <input type="date" id="feature-date-input" value="">
                    <div style="font-size: 12px; color: #999; margin-top: 5px;">默认: 昨天</div>
                </div>

                <div class="card-title" style="margin-top: 20px;">
                    <span><span class="icon">⚡</span>执行状态</span>
                </div>
                <div id="execution-status" class="status-bar">
                    <div>状态: <span id="status-text">就绪</span></div>
                    <div id="progress-text" style="margin-top: 5px; font-size: 12px; color: #999;"></div>
                </div>

                <button id="execute-btn" class="btn btn-primary" onclick="executeTrading()">
                    🚀 执行每日交易
                </button>

                <button id="stop-btn" class="btn btn-danger" onclick="stopExecution()" style="display: none;">
                    ⛔ 停止执行
                </button>

                <div id="log-section" style="display: none; margin-top: 15px;">
                    <div class="card-title">
                        <span><span class="icon">📝</span>执行日志</span>
                    </div>
                    <div id="log-content" class="log-content"></div>
                </div>
            </div>

            <!-- 交易报告标签页 -->
            <div id="reports-tab" class="tab-content">
                <div class="card-title">
                    <span><span class="icon">📄</span>最近报告</span>
                </div>
                <div id="reports-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 手动交易标签页 -->
            <div id="manual-tab" class="tab-content">
                <div class="card">
                    <div class="card-title">手动交易</div>
                    <div class="tabs">
                        <button class="tab-btn active" onclick="showManualTab('sell')">卖出</button>
                        <button class="tab-btn" onclick="showManualTab('buy')">买入</button>
                    </div>

                    <!-- 卖出面板 -->
                    <div id="sell-panel" class="tab-panel">
                        <div class="form-group">
                            <label>选择股票:</label>
                            <select id="sell-stock-select" onchange="updateSellAvailable()">
                                <option value="">请选择...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>可卖数量:</label>
                            <span id="sell-available">-</span>
                        </div>
                        <div class="form-group">
                            <label>卖出数量:</label>
                            <input type="number" id="sell-quantity" placeholder="请输入数量">
                        </div>
                        <div class="form-group">
                            <label>卖出价格:</label>
                            <input type="number" id="sell-price" placeholder="请输入价格" step="0.01">
                        </div>
                        <button class="btn btn-danger" onclick="manualSell()">确认卖出</button>
                        <div id="sell-message"></div>
                    </div>

                    <!-- 买入面板 -->
                    <div id="buy-panel" class="tab-panel" style="display:none;">
                        <div class="form-group">
                            <label>选择股票(从建议中选择或手动输入):</label>
                            <select id="buy-stock-select" onchange="updateBuyInfo()">
                                <option value="">请选择...</option>
                            </select>
                            <input type="text" id="buy-stock-code" placeholder="或直接输入股票代码如: 600200.SH" style="margin-top:5px;">
                        </div>
                        <div class="form-group">
                            <label>建议得分:</label>
                            <span id="buy-score">-</span>
                        </div>
                        <div class="form-group">
                            <label>买入价格:</label>
                            <input type="number" id="buy-price" placeholder="请输入价格" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>买入数量:</label>
                            <input type="number" id="buy-quantity" placeholder="请输入数量">
                        </div>
                        <button class="btn btn-success" onclick="manualBuy()">确认买入</button>
                        <div id="buy-message"></div>
                    </div>
                </div>
            </div>

            <!-- 数据准备标签页 -->
            <div id="dataprep-tab" class="tab-content">
                <div class="card">
                    <div class="card-title">数据准备</div>
                    <div class="button-group">
                        <div class="script-status">
                            <button class="btn" id="st-filter-btn" onclick="toggleStFilter()">执行ST股票过滤</button>
                            <span id="st-filter-status" class="status-text">空闲</span>
                        </div>
                        <div class="script-status">
                            <button class="btn" id="stock-nd-btn" onclick="toggleStockNd()">下载股票数据</button>
                            <span id="stock-nd-status" class="status-text">空闲</span>
                        </div>
                    </div>
                    <div id="data-prep-message"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑资金模态框 -->
    <div id="cash-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑资金</div>
                <div class="modal-close" onclick="closeCashModal()">×</div>
            </div>
            <div class="input-group">
                <label>当前资金 (元)</label>
                <input type="number" id="cash-input" step="0.01" placeholder="请输入资金金额">
            </div>
            <button class="btn btn-success" onclick="saveCash()">💾 保存</button>
        </div>
    </div>

    <!-- 编辑持仓模态框 -->
    <div id="positions-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑持仓</div>
                <div class="modal-close" onclick="closePositionsModal()">×</div>
            </div>

            <!-- 添加新持仓按钮 -->
            <div class="add-position-card" onclick="addNewPosition()">
                <div class="add-position-icon">➕</div>
                <div>添加新持仓</div>
            </div>

            <!-- 持仓编辑器容器 -->
            <div id="positions-editor">
                <div class="loading">加载中...</div>
            </div>

            <button class="btn btn-success" onclick="savePositions()">💾 保存所有持仓</button>
        </div>
    </div>

    <!-- 查看报告模态框 -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="report-modal-title">交易报告</div>
                <div class="modal-close" onclick="closeReportModal()">×</div>
            </div>
            <div id="report-content" class="log-content" style="max-height: 60vh;"></div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE = '';

        // 当前持仓数据
        let currentPositions = [];

        // 页面加载时初始化
        window.onload = function() {
            loadCashInfo();
            loadPositions();
            loadReports();
            startStatusPolling();
            // 新功能初始化
            loadSellableStocks();
            loadBuyableStocks();
            loadAuxScriptStatus();
        };

        // ========== 手动交易 ==========
        function loadSellableStocks() {
            fetch('/api/trading/sellable-stocks')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('sell-stock-select');
                    select.innerHTML = '<option value="">请选择...</option>';
                    if (data.success) {
                        data.data.forEach(stock => {
                            const opt = document.createElement('option');
                            opt.value = stock.code;
                            opt.textContent = stock.code + ' (成本:' + stock.avg_cost + ', 数量:' + stock.shares + ')';
                            opt.dataset.shares = stock.shares;
                            select.appendChild(opt);
                        });
                    }
                });
        }

        function updateSellAvailable() {
            const select = document.getElementById('sell-stock-select');
            const opt = select.options[select.selectedIndex];
            document.getElementById('sell-available').textContent = opt.dataset.shares || '-';
        }

        function loadBuyableStocks() {
            fetch('/api/trading/buyable-stocks?days=3')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('buy-stock-select');
                    select.innerHTML = '<option value="">请选择...</option>';
                    if (data.success) {
                        data.data.forEach(stock => {
                            const opt = document.createElement('option');
                            opt.value = stock.code;
                            opt.textContent = stock.code + ' (得分:' + stock.score + ')';
                            opt.dataset.score = stock.score;
                            select.appendChild(opt);
                        });
                    }
                });
        }

        function updateBuyInfo() {
            const select = document.getElementById('buy-stock-select');
            const opt = select.options[select.selectedIndex];
            document.getElementById('buy-score').textContent = opt.dataset.score || '-';
        }

        function manualSell() {
            const stock_code = document.getElementById('sell-stock-select').value;
            const quantity = parseInt(document.getElementById('sell-quantity').value);
            const price = parseFloat(document.getElementById('sell-price').value);

            if (!stock_code || !quantity || !price) {
                alert('请填写完整信息');
                return;
            }

            fetch('/api/trading/sell', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({stock_code, quantity, price})
            })
            .then(r => r.json())
            .then(data => {
                const msg = document.getElementById('sell-message');
                if (data.success) {
                    msg.textContent = '卖出成功！';
                    msg.className = 'success';
                    loadSellableStocks();
                    loadCashInfo();
                } else {
                    msg.textContent = data.error;
                    msg.className = 'error';
                }
            });
        }

        function manualBuy() {
            let stock_code = document.getElementById('buy-stock-code').value.trim();
            if (!stock_code) {
                stock_code = document.getElementById('buy-stock-select').value;
            }
            const price = parseFloat(document.getElementById('buy-price').value);
            const quantity = parseInt(document.getElementById('buy-quantity').value);

            if (!stock_code || !price || !quantity) {
                alert('请填写股票代码、买入价格和数量');
                return;
            }

            fetch('/api/trading/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({stock_code, price, quantity})
            })
            .then(r => r.json())
            .then(data => {
                const msg = document.getElementById('buy-message');
                if (data.success) {
                    msg.textContent = '买入成功！';
                    msg.className = 'success';
                    loadSellableStocks();
                    loadCashInfo();
                } else {
                    msg.textContent = data.error;
                    msg.className = 'error';
                }
            });
        }

        // ========== 手动交易子Tab切换 ==========
        function showManualTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

                if (running) {
                    btn.textContent = '停止';
                    btn.className = 'btn btn-danger';
                    status.textContent = progress || '运行中...';
                    status.className = 'status-text running';
                } else {

                    btn.className = 'btn';

        // 保存持仓
        async function savePositions() {
            try {
                // 从表单收集数据
                const updatedPositions = [];
                const inputs = document.querySelectorAll('.position-editor-input');
                
                // 按索引组织数据
                const positionsByIndex = {};
                inputs.forEach(input => {
                    const index = input.dataset.index;
                    const field = input.dataset.field;
                    
                    if (!positionsByIndex[index]) {
                        positionsByIndex[index] = {};
                    }
                    
                    positionsByIndex[index][field] = input.value;
                });
                
                // 验证并转换为数组
                let hasError = false;
                for (let index in positionsByIndex) {
                    const position = positionsByIndex[index];
                    
                    // 验证必填字段
                    if (!position.code || !position.shares || !position.avg_cost || 
                        !position.entry_date || !position.stop_loss_price || !position.take_profit_price) {
                        alert(`持仓 #${parseInt(index) + 1} 有必填字段未填写`);
                        hasError = true;
                        break;
                    }
                    
                    // 验证股票代码格式
                    if (!/^\d{6}\.(SH|SZ)$/.test(position.code)) {
                        alert(`持仓 #${parseInt(index) + 1} 的股票代码格式不正确\n正确格式: 688528.SH 或 000001.SZ`);
                        hasError = true;
                        break;
                    }
                    
                    updatedPositions.push(position);
                }
                
                if (hasError) {
                    return;
                }
                
                // 发送到服务器
                const response = await fetch(API_BASE + '/api/portfolio/positions', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({positions: updatedPositions})
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('持仓更新成功！');
                    currentPositions = updatedPositions;
                    closePositionsModal();
                    loadPositions();
                } else {
                    alert('更新失败: ' + result.error);
                }
            } catch (error) {
                alert('保存失败: ' + error.message);
                console.error('保存持仓失败:', error);
            }
        }

        // 执行交易
        async function executeTrading() {
            // 先检查当前状态，防止重复执行
            try {
                const statusResponse = await fetch(API_BASE + '/api/status');
                const currentStatus = await statusResponse.json();
                
                if (currentStatus.running) {
                    alert('脚本正在运行中，请勿重复执行！');
                    return;
                }
            } catch (error) {
                console.error('检查状态失败:', error);
            }
            
            if (!confirm(`确定要执行每日交易吗？\n\n这将:\n1. 进行特征工程\n2. 生成预测\n3. 执行交易策略`)) {
                return;
            }

            try {
                document.getElementById('execute-btn').disabled = true;
                document.getElementById('execute-btn').style.display = 'none';
                document.getElementById('stop-btn').style.display = 'block';
                document.getElementById('status-text').textContent = '启动中...';


                // 获取今天和昨天的日期作为默认值
                 const today = new Date();
                 const tomorrow = new Date(today);
                 tomorrow.setDate(today.getDate() + 1);
                 // 格式化日期为 YYYY-MM-DD
                 const formatDate = (date) => date.toISOString().split('T')[0];
                 // 从输入框获取值，若无则使用默认值
                 const predict_date = document.getElementById('predict-date-input').value || formatDate(tomorrow);
                 const feature_date = document.getElementById('feature-date-input').value || formatDate(today);
                 const response = await fetch(API_BASE + '/api/execute', {
                     method: 'POST',
                     headers: {
                         'Content-Type': 'application/json', // 关键：声明 JSON 类型
                     },
                     body: JSON.stringify({
                         predict_date: predict_date,
                         feature_date: feature_date
                     })
                 });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('log-section').style.display = 'block';
                    startLogPolling();
                } else {
                    alert('执行失败: ' + result.error);
                    document.getElementById('execute-btn').disabled = false;
                    document.getElementById('execute-btn').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'none';
                }
            } catch (error) {
                alert('执行失败');
                console.error('执行交易失败:', error);
                document.getElementById('execute-btn').disabled = false;
                document.getElementById('execute-btn').style.display = 'block';
                document.getElementById('stop-btn').style.display = 'none';
            }
        }

        // 轮询执行状态
        let statusInterval = null;
        function startStatusPolling() {
            if (statusInterval) clearInterval(statusInterval);
            
            // 立即检查一次状态
            updateStatus();
            
            // 然后每2秒检查一次
            statusInterval = setInterval(updateStatus, 2000);

        // 更新状态的函数
        async function updateStatus() {
            try {
                const response = await fetch(API_BASE + '/api/status');
                const status = await response.json();
                
                if (status.running) {
                    document.getElementById('status-text').textContent = '运行中';
                    document.getElementById('progress-text').textContent = status.progress || '';
                    document.getElementById('execution-status').className = 'status-bar status-running';
                    document.getElementById('execute-btn').disabled = true;
                    document.getElementById('execute-btn').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'block';
                    document.getElementById('stop-btn').disabled = false;
                    
                    // 如果正在运行，确保日志轮询也在运行
                    if (status.log_file && !logInterval) {
                        document.getElementById('log-section').style.display = 'block';
                        startLogPolling();
                    }
                } else {
                    document.getElementById('status-text').textContent = '就绪';
                    document.getElementById('progress-text').textContent = status.progress || '';
                    document.getElementById('execution-status').className = 'status-bar';
                    document.getElementById('execute-btn').disabled = false;
                    document.getElementById('execute-btn').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'none';
                }
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }

        // 轮询日志
        let logInterval = null;
        let currentLogFile = null;
        function startLogPolling() {
            if (logInterval) clearInterval(logInterval);

            logInterval = setInterval(async () => {
                try {
                    const statusResponse = await fetch(API_BASE + '/api/status');
                    const status = await statusResponse.json();

                    console.log('[LOG] Status:', status);

                    if (status.log_file) {
                        const logFile = status.log_file.split(/[/\\]/).pop();
                        console.log('[LOG] Log file:', logFile);

                        const logResponse = await fetch(API_BASE + '/api/logs/' + logFile);
                        const logResult = await logResponse.json();

                        console.log('[LOG] Log result:', logResult);

                        if (logResult.success) {
                            const logDiv = document.getElementById('log-content');
                            logDiv.textContent = logResult.content;
                            logDiv.scrollTop = logDiv.scrollHeight;
                        }
                    }
                    
                    if (!status.running && logInterval) {
                        clearInterval(logInterval);
                        logInterval = null;
                        loadCashInfo();
                        loadPositions();
                    }
                } catch (error) {
                    console.error('获取日志失败:', error);
                }
            }, 2000);
        }

            }
        };

        // 页面加载完成后自动填充默认日期
        document.addEventListener('DOMContentLoaded', function() {
            // 获取今天和昨天的日期
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);

            // 格式化日期为 YYYY-MM-DD（适配 date 输入框的格式）
            const formatDate = (date) => date.toISOString().split('T')[0];

            // 填充到输入框
            const predictDateInput = document.getElementById('predict-date-input');
            const featureDateInput = document.getElementById('feature-date-input');

            if (predictDateInput) {
                predictDateInput.value = formatDate(tomorrow);
            }
            if (featureDateInput) {
                featureDateInput.value = formatDate(today);
            }
        });
    </script>
</body>
</html>
